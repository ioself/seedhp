<!DOCTYPE html>
<html lang="ja">
    <!--element IDの付け方-->
    <!--bodyの中の要素の場合は、<親要素のID>_<自分の要素(div,p,span...)><親要素内のその要素の出現回数>-->
    <!--それ以外の要素の場合は最初に"_"を付ける-->
    <!--body直下ならbodyは略して問題ない。-->
    <!--親要素内で絶対に1つしか作らない要素の場合は、数字を書かなくても良い。-->
    <head id="_head1">
        <meta charset="UTF-8">
        <base href="/seedhp/">
        <style id="_head1_style1">
            html{
                scroll-behavior: smooth;
                height: 100%;
                width: 100%;
            }
            body{
                position:relative;
                display: flex;
                height:100%;
                flex-direction: column;/*これなんなんだろ。よく分からん。今度調べること忘れずに。*/
                min-height: 100vh;
                margin: 0;
                padding-top: 60px;
            }
            header{
                position: fixed;
                display: flex;/*flexとは?*/
                background-color: #404040;
                width: 100%;
                height:60px;
                max-height:60px;
                top:0px;
                left:0px;
                z-index:32767;
                white-space: nowrap;/*正直これもよく分かってない*/
            }
            footer{
                position:relative;
                background-color: #888888;
                width: 100%;
                min-width: 100vw;
                height:60px;
                max-height: max-content;
                bottom:0px;
                left:0px;
                margin:0px;
                white-space: nowrap;
            }
            .header_el{
                position:relative;
                color:white;
                text-decoration: none;
            }
            .header_el:hover{
                text-decoration: underline;
                cursor: pointer;
            }
            .header_el_top_node{
                position:relative;
                max-height: 60px;
                max-width: max-content;
                white-space: nowrap;
                padding-left:24px;
                /*padding-top: 16px;*/
                align-items: center;
                display:flex;
            }
            .links_el{
                position:absolute;
                text-decoration: none;
            }
            .links_el:hover{
                text-decoration: underline;
                cursor: pointer;
            }
            #div{
                position:relative;
                display: flex;
                flex: 1;
            }
            #header_div{
                position:relative;
                min-width: 100%;
                max-height: 100%;
                flex:1;
                white-space:nowrap;
                display:flex;
            }
        </style>
    </head>
    <body id="body">
        <header id="header">
            <div id="header_div">
                <span id="header_div_span1" class="header_el_top_node">
                    <span
                        id="header_div_span1_span1"
                        class="header_el"
                        title="トップページへ移動します"
                        style="font-size:1.25rem"
                        href="index.html"
                    >Seed HP</span>
                </span>
                <span id="header_div_span2" class="header_el_top_node">
                    <span
                        id="header_div_span2_span1"
                        class="header_el"
                        title="ブログへ移動します"
                        style="font-size:1rem"
                        href="article/blog"    
                    >Blog</span>
                </span>
                <span id="header_div_span3" class="header_el_top_node">
                    <span
                        id="header_div_span3_span1"
                        class="header_el"
                        title="ブログリストへ移動します"
                        style="font-size: 1rem;"
                        href="article/bloglist/"
                    >BlogList</span>
                </span>
            </div>
        </header>
        <div id="div">

        </div>
        <footer>
            Test
        </footer>
    </body>
    <script>
        function func(cmd,...parametor){
            if (cmd==="screen_scroll"){
                try{
                    const moveToX=parametor[0]
                    const moveToY=parametor[1]
                    if (moveToX===undefined||moveToY===undefined){
                        return 1
                    }
                    if (typeof moveToX!=="number"||typeof moveToY!=="number"){
                        return 1
                    }
                    window.scrollTo({top:moveToX,left:moveToY,behavior:"smooth"})
                    return 0
                }catch(e){
                    return 1
                }
            }
        }
    </script>
</html>
